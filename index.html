<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toronto Trip Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>🍁 Toronto Trip Planner</h1>
      <div class="header-date">
        <label for="start-date">Arrival date</label>
        <input type="date" id="start-date">
      </div>
    </div>
  </header>

  <div class="app-layout">

    <aside class="sidebar">
      <h2 class="sidebar-title">✨ Activities</h2>
      <select id="category-filter" class="category-filter">
        <option value="all">All activities</option>
        <option value="full-day">🗓 Full Day</option>
        <option value="museums">🏛 Museums & Landmarks</option>
        <option value="outdoors">🌿 Parks & Outdoors</option>
        <option value="neighbourhoods">🏙 Neighbourhoods</option>
        <option value="evenings">🌙 Evenings</option>
      </select>
      <p class="sidebar-hint">Drag onto a day →</p>
      <div id="activity-pool" class="activity-pool"></div>
      <div id="trash-zone" class="trash-zone">
        <span>🗑️ Drop here to remove</span>
      </div>
    </aside>

    <main class="schedule-wrap">
      <div id="schedule" class="schedule"></div>
      <div class="below-calendar">
        <div class="bc-tabs">
          <button class="bc-tab active" data-tab="transit">🚇 Getting Around</button>
          <button class="bc-tab" data-tab="neighbourhoods">🏙️ Neighbourhoods</button>
          <button class="bc-tab" data-tab="combos">🗺️ Day Combos</button>
        </div>
        <div class="bc-panel active" id="panel-transit">
          <p class="bc-subheading">Toronto transit basics for first-timers</p>
          <div id="transit-grid" class="transit-grid"></div>
        </div>
        <div class="bc-panel" id="panel-neighbourhoods">
          <p class="bc-subheading">What each part of the city is known for</p>
          <div id="neighbourhood-grid" class="neighbourhood-grid"></div>
        </div>
        <div class="bc-panel" id="panel-combos">
          <p class="bc-subheading">Activities that work well together geographically</p>
          <div id="combos-grid" class="combos-grid"></div>
        </div>
      </div>
    </main>

  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Touch drag-and-drop polyfill for mobile -->
  <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.1/DragDropTouch.js"></script>
  <script src="app.js"></script>
</body>
</html>
